<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" id="viewport-meta" content="width=1200, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var targetWidth = 1200;
          var meta = document.getElementById('viewport-meta') || document.querySelector('meta[name="viewport"]');
          if (meta) {
            var screenW = window.screen && window.screen.width ? window.screen.width : window.innerWidth;
            if (screenW && screenW < targetWidth) {
              var initialScale = screenW / targetWidth;
              meta.setAttribute('content', 'width=' + targetWidth + ', initial-scale=' + initialScale + ', maximum-scale=5.0, user-scalable=yes');
            } else {
              meta.setAttribute('content', 'width=1200, initial-scale=1.0');
            }
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          localStorage.removeItem('worldvest_theme');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } catch (e) {}
      })();
    </script>
    <title>WorldvestCapital | Home - crypto investment & Exchange platform</title>
    <meta name="description" content="WorldvestCapital investment and currency exchange platform with high fidelity UI, interactive dashboard, multiple page views (Home, About Us, FAQs, Registration, Deposit Plans), live currency rates, and dynamic animations." />
    <meta property="og:title" content="WorldvestCapital | Home - crypto investment & Exchange platform" />
    <meta property="og:description" content="Exactly cloned investment and currency exchange platform with high fidelity UI, interactive dashboard, multiple page views (Home, About Us, FAQs, Registration, Deposit Plans), live currency rates, and dynamic animations." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#C59B4E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WorldVest" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
